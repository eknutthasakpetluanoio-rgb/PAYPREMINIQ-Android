name: Build PAYPREMINIQ APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q PAYPREMINIQ-Android-BuildReady.zip -d .
          echo "Extracted files:"
          ls -la
          echo "Android project:"
          ls -la PAYPREMINIQ-Android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: PAYPREMINIQ-Android
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PAYPREMINIQ-debug-apk
          path: PAYPREMINIQ-Android/app/build/outputs/apk/debug/app-debug.apk