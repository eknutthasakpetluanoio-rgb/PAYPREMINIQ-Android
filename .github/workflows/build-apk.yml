name: Build PAYPREMINIQ APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract Android project
        run: |
          unzip -q PAYPREMINIQ-Android-BuildReady.zip -d extracted
          echo "=== Extracted structure ==="
          find extracted -maxdepth 4 -type f | sort

      - name: Build debug APK
        working-directory: extracted
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Check APK
        run: |
          ls -lh extracted/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PAYPREMINIQ-debug-apk
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
